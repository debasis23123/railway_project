<!DOCTYPE html>
<html>
<head>
    <title>Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container mt-5">
    <div class="card p-5 text-center shadow">

        <h2 class="text-success">✔ Payment Successful</h2>

        <p class="mt-3">Your ticket is confirmed</p>

        <h4>PNR: {{ booking.pnr }}</h4>

        <p>Train: {{ booking.train.name }}</p>
        <p>Status: {{ booking.status }}</p>

        <a href="{% url 'download_ticket' booking.id %}" class="btn btn-primary mt-3">
            Download Ticket
        </a>

        <a href="{% url 'dashboard' %}" class="btn btn-dark mt-2">
            Go to Dashboard
        </a>

    </div>
</div>

</body>
</html>
