<!DOCTYPE html>
<html>
<head>
    <title>Book Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        .card {
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">🚆 Book Your Ticket</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Train</label>
                <select name="train" class="form-control">
                    {% for train in trains %}
                        <option value="{{ train.id }}">{{ train.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date" name="date" class="form-control">
            </div>

            <div class="mb-3">
                <label>No. of Passengers</label>
                <input type="number" name="count" class="form-control">
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control">
            </div>

            <hr>

            <!-- Passenger Fields -->
            {% for i in "12345" %}
            <div class="border p-3 mb-3 rounded">
                <h6>Passenger {{ forloop.counter }}</h6>
                <input type="text" name="name{{ forloop.counter }}" placeholder="Name" class="form-control mb-2">
                <input type="number" name="age{{ forloop.counter }}" placeholder="Age" class="form-control mb-2">
                <select name="gender{{ forloop.counter }}" class="form-control">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>
            {% endfor %}

            <button class="btn btn-dark w-100">Proceed to Payment</button>
        </form>
    </div>
</div>

</body>
</html>
