<!DOCTYPE html>
<html>
<head>
    <title>Railway System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">🚆 IRCTC Clone</span>

    <div>
        <a href="/" class="btn btn-light">Home</a>
        <a href="/book/" class="btn btn-warning">Book</a>
        <a href="/dashboard/" class="btn btn-info">Dashboard</a>
    </div>
</nav>


<div class="container mt-5">

    <h2 class="mb-4 text-center">Available Trains</h2>

    <div class="row">
        {% for train in trains %}
        <div class="col-md-4">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h5 class="card-title">{{ train.name }}</h5>
                    <p>📍 {{ train.source }} → {{ train.destination }}</p>
                    <p>💺 Seats: {{ train.seats }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
